<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madhur Sweets &amp; Bakery | Fresh sweets, cakes and gifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--page:#EFEBE3;--surface-1:#F7F4EE;--surface-2:#FFFFFF;--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.26);--text-primary:#1F1B18;--text-secondary:#5C5650;--text-muted:#8C857C;--bg-accent:#FBE9E6;--text-accent:#7B1113;--border-accent:#D9A6A0;--bg-success:#E3F2E1;--text-success:#1E5A2B;--radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1B1917;--surface-1:#262320;--surface-2:#312D29;--border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.28);--text-primary:#EDE8E0;--text-secondary:#B8B1A6;--text-muted:#8C857A;--bg-accent:#4A1E20;--text-accent:#F1C9C4;--border-accent:#A4504A;--bg-success:#1F4A27;--text-success:#BFE3C2}}
:root[data-theme="dark"]{--page:#1B1917;--surface-1:#262320;--surface-2:#312D29;--border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.28);--text-primary:#EDE8E0;--text-secondary:#B8B1A6;--text-muted:#8C857A;--bg-accent:#4A1E20;--text-accent:#F1C9C4;--border-accent:#A4504A;--bg-success:#1F4A27;--text-success:#BFE3C2}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--text-primary);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:24px;font-weight:500;margin:0 0 4px}
.lead{margin:0 0 14px;color:var(--text-secondary)}
button{font:inherit;cursor:pointer;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);padding:6px 14px}
button:hover{background:var(--surface-1)}
button:focus-visible,select:focus-visible{outline:2px solid #7B1113;outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);padding:8px 0}
.langbar{display:flex;justify-content:flex-end;gap:6px;margin:4px 0 8px}
.langbar button{min-width:72px;font-size:13px;padding:5px 12px}
.langbar button.on{background:#7B1113;color:#fff;border-color:#7B1113}
.tab{font-size:14px;padding:6px 14px}
.tab.on{background:#7B1113;color:#fff;border-color:#7B1113}
.panel[hidden]{display:none}
.legend{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text-secondary);margin:0 0 12px}
.nwd{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2E8B4A;flex:none}
.grp{margin:0 0 10px}
.gl{font-size:12px;color:var(--text-muted);margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-color:var(--border);color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;background:transparent}
.chip.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.stage{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px;overflow-x:auto}
.sys{margin:16px 0 4px;font-size:13px;color:var(--text-secondary)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 10px}
.sc{font-size:12px;padding:4px 10px;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--border-strong)}
.sf{font-size:12px;padding:4px 10px;border-radius:var(--radius);background:var(--bg-success);color:var(--text-success)}
.arw{color:var(--text-muted);font-size:13px}
.steps{list-style:none;margin:6px 0 10px;padding:0;display:grid;gap:6px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-size:14px}
.steps li:before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:#7B1113;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.ct{font-size:13px;color:var(--text-secondary)}
svg{vertical-align:-3px}
/* ---------- mock (brand) ---------- */
.scr{background:#F5EFE3;color:#2B1B17;font-size:13px;line-height:1.45}
.mock{min-width:720px;border-radius:12px;border:1px solid var(--border-strong);overflow:hidden}
.card{background:#fff;border:1px solid #E3D8C4;border-radius:14px;padding:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:#6B5D55}
.mar{color:#7B1113;font-weight:500}
.h{font-size:18px;font-weight:500;margin:0 0 10px;color:#2B1B17}
.inp{background:#fff;border:1px solid #E3D8C4;border-radius:10px;padding:7px 11px;color:#6B5D55;margin:3px 0 8px}
.btn{background:#7B1113;color:#fff;text-align:center;padding:8px 12px;border-radius:10px;font-weight:500;margin-top:8px}
.btn2{border:1.5px solid #7B1113;color:#7B1113;text-align:center;padding:6px 12px;border-radius:10px;font-weight:500;margin-top:8px}
.pill{display:inline-block;border:1px solid #E3D8C4;background:#fff;border-radius:999px;padding:3px 12px;margin:0 6px 6px 0;font-size:12px}
.pill.on{background:#7B1113;color:#fff;border-color:#7B1113}
.bd{font-size:11px;padding:2px 9px;border-radius:999px;display:inline-block;white-space:nowrap}
.dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.logo{font-weight:600;font-size:18px;color:#7B1113}
.hdr{background:#fff;border-bottom:1px solid #E3D8C4;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px}
.admbar{background:#7B1113;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:9px 14px}
.shell{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:440px}
.side{background:#fff;border-right:1px solid #E3D8C4;padding:10px 8px}
.si{padding:6px 10px;border-radius:8px;margin-bottom:2px;font-size:12.5px;color:#4B3F39;cursor:pointer;width:100%;text-align:left;background:transparent;border:0;font-family:inherit}
.si.on{background:#FBE9E6;color:#7B1113;font-weight:500}
.main{padding:14px;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kp{padding:9px 11px}
.tr{display:grid;gap:8px;padding:7px 4px;border-bottom:1px solid #E3D8C4;align-items:center;font-size:12px}
.tr.hd{font-size:11px;color:#6B5D55;border-bottom:1px solid #D9CBB0}
.pbar{height:6px;border-radius:3px;background:#E3D8C4;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:#7B1113;border-radius:3px}
.th{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none}
.kcol{background:#EFE6D3;border-radius:10px;padding:8px;min-height:150px}
.kcard{background:#fff;border:1px solid #E3D8C4;border-radius:8px;padding:7px 8px;margin-top:6px;font-size:12px}
/* ---------- homepage ---------- */
.site{background:#F4EFE4;color:#2B1B17;border-radius:12px;overflow:hidden;border:1px solid var(--border-strong);font-size:14px}
.ann{background:#7B1113;color:#F3DCD6;font-size:12px;text-align:center;padding:6px 10px}
.hh{display:flex;align-items:center;gap:14px;padding:10px 22px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;line-height:1.1}
.lgc{width:36px;height:36px;border-radius:50%;background:#7B1113;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;border:2px solid #E7B9B0}
.lgt b{display:block;font-size:15px;letter-spacing:.04em;color:#7B1113}
.lgt span{font-size:11px;color:#6B5D55;letter-spacing:.05em}
.hn{display:flex;gap:16px;flex:1;justify-content:center;flex-wrap:wrap;font-size:14px}
.hn a{color:#2B1B17;text-decoration:none;padding:3px 10px;border-radius:999px}
.hn a.on{background:#F0D9D3;color:#7B1113;font-weight:500}
.hcta{border:1px solid #7B1113;border-radius:999px;padding:5px 14px;color:#7B1113;font-size:13px;background:#fff}
.hph{font-size:13px;color:#4B3F39}
.fbar{display:flex;align-items:center;gap:8px;padding:6px 22px;background:#fff;border-top:1px solid #E3D8C4;border-bottom:1px solid #E3D8C4;font-size:12px;flex-wrap:wrap}
.fbar select{font:inherit;border:1px solid #D9CBB0;border-radius:6px;padding:3px 8px;background:#fff;color:#2B1B17}
.fbar button{background:#7B1113;color:#fff;border-color:#7B1113;padding:3px 12px;font-size:12px}
.cartf{margin-left:auto;background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 2px 10px rgba(80,30,20,.18);display:flex;align-items:center;gap:8px;font-weight:500;color:#2B1B17;position:relative}
.cartf b{position:absolute;top:-6px;left:10px;background:#7B1113;color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}
.hero{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:28px;padding:34px 26px 26px;background:#F4EFE4;background-image:linear-gradient(rgba(123,17,19,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(123,17,19,.05) 1px,transparent 1px);background-size:26px 26px;align-items:center}
.htag{display:inline-block;border:1px solid #D9CBB0;background:#fff;border-radius:999px;padding:3px 14px;font-size:13px;color:#7B1113;margin-bottom:14px}
.hero h2{font-size:46px;line-height:1.15;margin:0 0 12px;font-weight:600;color:#2B1B17}
.hero h2 em{font-style:normal;color:#7B1113;display:block}
.hero p{max-width:460px;color:#5C4E48;margin:0 0 18px;font-size:15px}
.hb{display:flex;gap:10px;flex-wrap:wrap}
.hb .p{background:#7B1113;color:#fff;border-radius:999px;padding:9px 26px;font-weight:500;box-shadow:0 6px 14px rgba(123,17,19,.28);border-color:#7B1113}
.hb .s{background:#fff;color:#2B1B17;border-radius:999px;padding:9px 22px;font-weight:500}
.hctl{display:flex;align-items:center;gap:8px;margin-top:22px}
.hctl button{width:30px;height:30px;border-radius:50%;padding:0;background:#fff}
.hctl .dt{width:18px;height:6px;border-radius:3px;background:#D9CBB0;padding:0;border:0}
.hctl .dt.on{width:30px;background:#7B1113}
.hv{position:relative;padding:16px 80px 16px 16px;border-radius:18px;background-color:#1d1b1a;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:26px 26px;min-width:0}
.hv .m{border-radius:15px;overflow:hidden;aspect-ratio:5/4;background:#fff}
.hv .m img,.hv .sd img{width:100%;height:100%;object-fit:cover;display:block}
.hv .sd{position:absolute;top:16px;right:16px;bottom:16px;width:50px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:thin}
.hv .sd button{width:50px;height:50px;flex:none;border-radius:10px;overflow:hidden;padding:0;border:2px solid #f6ede4;background:#fff}
.hv .sd button.on{border-color:#63a7ec;box-shadow:0 0 0 1px #63a7ec}
@media (max-width:520px){.hv{padding:10px 60px 10px 10px}.hv .sd{top:10px;right:10px;bottom:10px;width:42px}.hv .sd button{width:42px;height:42px}}
.strip{background:#E9CFA8;color:#6B2A1B;text-align:center;padding:9px 14px;font-size:13px}
.coll{padding:24px 26px 8px}
.eyebrow{font-family:'Roboto Condensed',sans-serif;font-size:13px;color:#4B3F39;letter-spacing:.04em}
.ctitle{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 8px}
.ctitle h3{font-family:'Roboto Condensed',sans-serif;font-size:38px;line-height:1.1;margin:0;font-weight:700}
.ctitle a{color:#7B1113;font-family:'Roboto Condensed',sans-serif;font-size:18px;text-decoration:none}
.crow{margin:0 0 18px}
.crow[hidden]{display:none}
.crow .rh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.crow .rh h4{font-family:'Roboto Condensed',sans-serif;font-size:22px;margin:0;color:#7B1113;font-weight:700}
.crow .rh a{font-size:12px;color:#7B1113;text-decoration:none}
.rw{position:relative}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 22px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pc{flex:0 0 clamp(150px,18.4%,210px);scroll-snap-align:start;background:#fff;border:1px solid #E3D8C4;border-radius:12px;padding:5px 5px 8px;box-shadow:0 2px 8px rgba(60,30,20,.08)}
.pc img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:9px;display:block}
.pc .n{font-family:'Roboto Condensed',sans-serif;font-size:17px;font-weight:700;margin:6px 4px 0;line-height:1.2}
.pc .pr{font-family:'Roboto Condensed',sans-serif;color:#7B1113;margin:0 4px 6px;font-size:14px}
.pc .add{width:calc(100% - 8px);margin:0 4px;background:#7B1113;color:#fff;border:0;border-radius:8px;padding:6px 0;font-size:14px;font-family:'Roboto Condensed',sans-serif;box-shadow:0 3px 6px rgba(123,17,19,.3)}
.pc .add:hover{background:#5E0C0E}
.arr{position:absolute;top:36%;width:28px;height:28px;border-radius:50%;padding:0;background:#6B5D55;color:#fff;border:0;z-index:2}
.arr.l{left:0}.arr.r{right:0}
.ftr{background:#6E0F12;color:#F0D9D3;padding:26px 26px 14px;margin-top:10px}
.ftr .cols{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:20px}
.ftr h5{margin:0 0 8px;font-size:15px;color:#fff}
.ftr a,.ftr p{display:block;color:#E6C6BE;font-size:13px;margin:0 0 5px;text-decoration:none}
.ftr .cp{border-top:1px solid rgba(255,255,255,.18);margin-top:16px;padding-top:8px;font-size:11px;text-align:center;color:#D2AFA6}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2B1B17;color:#fff;border-radius:10px;padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
/* ---------- features ---------- */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.fc{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.fc b{font-weight:500}
.fc p{margin:2px 0 0;font-size:13px;color:var(--text-secondary)}
.pr1,.pr2,.pr3{font-size:11px;padding:1px 9px;border-radius:999px;white-space:nowrap}
.pr1{background:#F6DEDB;color:#8A1F17}.pr2{background:#FBE9C6;color:#7A4B00}.pr3{background:#E3E8EC;color:#42525C}
.fh{font-size:15px;font-weight:500;margin:18px 0 8px}
/* ---------- roadmap ---------- */
.ph{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.ph header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ph h3{margin:0;font-size:17px;font-weight:500}
.ph .meta{font-size:12px;color:var(--text-secondary)}
.tk{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer;font-size:14px}
.tk i{flex:none;width:16px;height:16px;border:1.5px solid #7B1113;border-radius:4px;margin-top:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:11px}
.tk.done i{background:#7B1113}
.tk.done span{color:var(--text-muted);text-decoration:line-through}
.tkb{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin:8px 0 6px}
.tkb i{display:block;height:100%;background:#7B1113}
.out{font-size:13px;color:var(--text-success);background:var(--bg-success);border-radius:8px;padding:5px 10px;margin-top:8px}
.col{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.col div{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px}
.col code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--text-accent)}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:22px 16px}.hero h2{font-size:34px}.ftr .cols{grid-template-columns:1fr}.hh{padding:10px 14px}.coll{padding:18px 12px 6px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.wrap{padding:16px 10px 40px}}

/* ---- responsive fixes ---- */
.dt{position:relative}.dt::after{content:"";position:absolute;inset:-14px -4px}
@media (max-width:960px){
.hh{gap:10px}
.hn{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0}
.hn::-webkit-scrollbar{display:none}
.hn a{white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;padding:3px 14px}
.chip{min-height:40px;padding:8px 14px}
.fbar select,.fbar button{min-height:36px;padding-top:6px;padding-bottom:6px}
.arr{width:36px;height:36px}
.rail{padding-left:34px;padding-right:34px}
.content-policy{font-size:11px;padding:4px 8px;max-width:170px}
.contact-heading{font-size:12px}
.tour-help{bottom:10px}
}
@media (max-width:760px){
.mockwrap::before{content:"\2190  \09B8\09CB\09DF\09BE\0987\09AA \0995\09B0\09C1\09A8  \2192";display:block;text-align:center;font-size:12px;color:var(--text-muted);padding:0 0 6px}
}

/* ---- View All catalog view ---- */
.cv{padding:18px 26px 14px;scroll-margin-top:90px}
.cv[hidden]{display:none}
.coll{scroll-margin-top:90px}
.cvmode .hero,.cvmode .strip,.cvmode .coll{display:none}

.cvb{background:none;border:0;color:#7B1113;font:inherit;font-size:14px;padding:8px 0;min-height:40px;cursor:pointer}
.cvn{font-size:13px;opacity:.75;white-space:nowrap}
.cvbody{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start;gap:18px;margin-top:12px}
.cvf{display:grid;gap:16px;padding:16px;background:#fff;border:1px solid #E3D8C4;border-radius:14px;min-width:0}
.cvfh{font-size:17px;font-weight:600;color:#2B1B17;border-bottom:1px solid #E3D8C4;padding-bottom:8px}
.cvr{display:grid;gap:8px}
.cvr>label{font-weight:600;font-size:13px}
.cc{flex:0 0 auto;white-space:nowrap;border:1px solid #D9CBB0;background:#fff;color:#2B1B17;border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:13px;cursor:pointer}
.cc.on{background:#F0D9D3;border-color:#7B1113;color:#7B1113;font-weight:500}
.cvr select{font:inherit;font-size:13px;border:1px solid #D9CBB0;border-radius:8px;padding:9px 10px;background:#fff;color:#2B1B17;min-height:40px;width:100%;min-width:0;cursor:pointer}
.cvx{background:none;border:0;color:#7B1113;font:inherit;font-size:13px;text-decoration:underline;min-height:36px;cursor:pointer}
.cvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;min-width:0}
.cvg .pc{flex:none;min-width:0}
.cvempty{padding:28px 10px;text-align:center}
@media (max-width:760px){.cv{padding:14px 12px 10px}.cvbody{grid-template-columns:1fr}.cvf{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cvfh{grid-column:1/-1}.cvr{align-content:start}.cvr:last-child{grid-column:1/-1}.cvg{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ctitle h3{font-size:30px}}
@media (max-width:440px){.cvf{grid-template-columns:1fr}.cvfh,.cvr:last-child{grid-column:auto}}

/* ---- product search ---- */

/* ================= FLOW FACTORY ================= */
function mkFlow(p,S,groups,stepLabel){
var cur=0;
var root=$(p);
root.addEventListener('click',function(e){var target=e.target.closest('[data-flow-screen],[data-home]');if(!target)return;if(target.hasAttribute('data-home'))returnHome();else{cur=+target.getAttribute('data-flow-screen');render()}});
root.innerHTML='<div class="legend"><span class="nwd"></span><span>সবুজ বিন্দু মানে নতুন বা modern feature যুক্ত screen</span></div><div id="'+p+'n"></div><section class="stage" id="'+p+'s" aria-live="polite"></section><div class="sys">'+stepLabel+'</div><ol class="steps" id="'+p+'t"></ol><div class="sys">System-এ কী ঘটে</div><div class="flow" id="'+p+'f"></div><div class="sys">চাপ, concurrency ও নিরাপত্তায় সুরক্ষা</div><div class="flow" id="'+p+'z"></div><div class="nav2"><button type="button" id="'+p+'a">← আগে</button><span class="ct" id="'+p+'c"></span><button type="button" id="'+p+'b">পরে →</button></div>';
function render(){
var nav=$(p+'n');nav.innerHTML='';
groups.forEach(function(gn,gi){var w=document.createElement('div');w.className='grp';var l=document.createElement('div');l.className='gl';l.textContent=gn;w.appendChild(l);var cs=document.createElement('div');cs.className='chips';
S.forEach(function(s,i){if(s.g!==gi)return;var b=document.createElement('button');b.type='button';b.className='chip'+(i===cur?' on':'');if(s.nw){var d=document.createElement('span');d.className='nwd';b.appendChild(d)}b.appendChild(document.createTextNode(s.l));b.onclick=function(){cur=i;render()};cs.appendChild(b)});w.appendChild(cs);nav.appendChild(w)});
$(p+'s').innerHTML='<div class="mockwrap">'+S[cur].v()+'</div>';
$(p+'t').innerHTML=S[cur].steps.map(function(x){return '<li>'+x+'</li>'}).join('');
$(p+'f').innerHTML=S[cur].sys.map(function(x){return '<span class="sc">'+x+'</span>'}).join('<span class="arw" aria-hidden="true">›</span>');
$(p+'z').innerHTML=S[cur].safe.map(function(x){return '<span class="sf">'+x+'</span>'}).join('');
$(p+'c').textContent=(cur+1)+' / '+S.length;
}
function go(d){cur=(cur+d+S.length)%S.length;render()}
$(p+'a').onclick=function(){go(-1)};$(p+'b').onclick=function(){go(1)};
render();
return {go:go,set:function(i){cur=Math.max(0,Math.min(S.length-1,i));render()},get:function(){return cur}};
}

function openScreen(tab,index){showTab(tab);flows[tab].set(index);$('p'+tab).scrollIntoView({block:'start'})}

function showTab(i){
TABN.forEach(function(t){$('p'+t[0]).hidden=(t[0]!==i)});
[].forEach.call(document.querySelectorAll('.tab'),function(b){var k=parseInt(b.getAttribute('data-i'));b.className='tab'+(k===i?' on':'')+'';b.setAttribute('aria-selected',k===i)});

    message.hidden=false;
    clearTimeout(timer);
    timer=setTimeout(function(){message.hidden=true},2800);
  }
  ['copy','cut','paste'].forEach(function(type){
    document.addEventListener(type,function(event){deny(event,'Copy/paste is not allowed on this page.')},true);
  });
  document.addEventListener('contextmenu',function(event){deny(event,'The right-click menu is disabled on this page.')},true);
  document.addEventListener('dragstart',function(event){deny(event,'Dragging page content is not allowed.')},true);
  document.addEventListener('keydown',function(event){
    var key=event.key.toLowerCase();
    var modifier=event.ctrlKey||event.metaKey;
    var inspect=key==='f12'||(modifier&&event.shiftKey&&['i','j','c','k'].includes(key))||(event.metaKey&&event.altKey&&['i','j','c','u'].includes(key));
    if(inspect||(modifier&&['u','s','p'].includes(key))){
      deny(event,'Source inspection, saving and printing are not allowed.');
    }else if(modifier&&['c','x','v'].includes(key)){

    }
  },true);
})();

function mentorTip(text){
 if(/মুছ|বাতিল|রিফান্ড/.test(text))return 'আগে সঠিক রেকর্ড ও প্রযোজ্য শর্ত মিলিয়ে নিন। নমুনায় এই কাজের ফল বাস্তবে প্রয়োগ হয় না।';
 if(/পেমেন্ট|অগ্রিম|কুপন|পয়েন্ট/.test(text))return 'মোট টাকা, ছাড় এবং পেমেন্টের অবস্থা মিলিয়ে নিন। এটি নমুনা—কোনো টাকা নেওয়া হবে না।';
 if(/Rx|প্রেসক্রিপশন|পাওয়ার|লেন্স/.test(text))return 'প্রাসঙ্গিক Rx ও লেন্সের তথ্য মিলিয়ে বুঝুন; চূড়ান্ত চিকিৎসাগত যাচাই বিশেষজ্ঞের কাজ।';
 if(/OTP|role|permission|নিরাপত্তা|ডিভাইস/.test(text))return 'শুধু নিজের বা অনুমোদিত অ্যাকাউন্টের তথ্য ব্যবহার করুন। এই নমুনায় লগইন বা নিরাপত্তার পরিবর্তন হয় না।';
 if(/প্রিন্ট|CSV|PDF|এক্সপোর্ট|ডাউনলোড/.test(text))return 'কোন তথ্য রপ্তানি হবে তা আগে মিলিয়ে নিন। এই নমুনা স্ক্রিন থেকে বাস্তব ফাইল তৈরি হয় না।';
 if(/SMS|ক্যাম্পেইন|পাঠান|নোটিফিকেশন/.test(text))return 'প্রাপক, লেখা ও সময় নিশ্চিত করার নিয়ম বুঝুন। এই ডেমো কোনো বার্তা পাঠায় না।';
 return 'হাইলাইট করা অংশটি স্ক্রিনে চিনে নিন। এটি কাজের নমুনা; গাইড শেষে একই স্ক্রিন আবার খুলে দেখুন।';
}
function addDashboard(tab,screens,label){
 add(tab,'#p'+tab+'n',label+' · স্ক্রিন বাছাই','উপরের চিপগুলো দিয়ে প্রতিটি স্ক্রিন আলাদা করে দেখতে পারবেন। এই গাইড সব স্ক্রিনের প্রতিটি করণীয় ধাপে ধাপে দেখাবে।','সরাসরি ফিচারে যেতে গাইডের তালিকা ব্যবহার করুন।',{screen:0,group:label+' · পরিচিতি'});
 screens.forEach(function(screen,screenIndex){
  var group=label+' · '+screen.l;
  add(tab,'#p'+tab+'s .main',screen.l+' · পরিচিতি','এই স্ক্রিনে '+screen.steps.length+'টি করণীয় দেখাব। আগে স্ক্রিনটি চিনে নিন, এরপর প্রতিটি কাজের জায়গা এবং নিয়ম দেখুন।',demo,{screen:screenIndex,group:group});
  screen.steps.forEach(function(text,taskIndex){
   add(tab,null,screen.l+' · কাজ '+(taskIndex+1)+'/'+screen.steps.length,text,mentorTip(text),{screen:screenIndex,task:taskIndex,group:group});
  });
 });
 add(tab,'#p'+tab+' .nav2',label+' · আবার অনুশীলন','গাইডের বাইরে এই “আগে” ও “পরে” বাটন দিয়ে ড্যাশবোর্ডের স্ক্রিন ঘুরিয়ে দেখবেন। উপরের চিপে চাপলে সরাসরি নির্দিষ্ট স্ক্রিন আসে।','নমুনা স্ক্রিনের অনেক কন্ট্রোল ছবি/লেবেলের মতো দেখানো; গাইড সেগুলোর কাজের নিয়ম বোঝায়।',{screen:0,group:label+' · অনুশীলন'});
 if(tab===2)add(tab,'#p2s .side .si:last-child','লগআউট','নিজের অ্যাকাউন্ট ব্যবহার শেষে লগআউট করার প্রবেশপথ এটি।','এই নমুনায় আসল লগইন সেশন বা কার্যকর লগআউট নেই।',{screen:0,group:label+' · লগআউট'});
}
addDashboard(2,US,'User Dashboard');addDashboard(3,AS,'Admin Dashboard');
var steps=allSteps,storageKey='msi-mentor-tour-bakery-az-v2';
var root=document.getElementById('mentor-tour'),card=document.getElementById('tour-card'),spot=document.getElementById('tour-spotlight'),shade=document.getElementById('tour-shade');
var next=document.getElementById('tour-next'),prev=document.getElementById('tour-prev'),help=document.getElementById('tour-help'),scope=document.getElementById('tour-scope'),jump=document.getElementById('tour-jump');
var index=0,active=false,target=null,oldFocus=null,oldTab=0,inertStates=[],savedScroll=[],snapshot=null;
function rebuild(value){
 steps=allSteps.filter(function(step){return value==='all'||step.tab===Number(value)});index=0;jump.replaceChildren();
 var previous='';steps.forEach(function(step,i){if(step.group===previous)return;previous=step.group;var option=document.createElement('option');option.value=String(i);option.textContent=step.group;jump.appendChild(option)});
}
function position(){
 if(!active)return;
 var rect=target&&target.getBoundingClientRect(),usable=rect&&rect.width>0&&rect.height>0;
 spot.hidden=!usable;shade.hidden=!!usable;card.style.top='';card.style.bottom='';card.style.maxHeight='calc(100dvh - 24px)';
 if(!usable){card.style.top='50%';card.style.transform='translate(-50%,-50%)';return}
 card.style.transform='translateX(-50%)';var w=window.innerWidth,h=window.innerHeight;
 var left=Math.max(6,rect.left-6),top=Math.max(6,rect.top-6);
 spot.style.left=left+'px';spot.style.top=top+'px';spot.style.width=Math.max(0,Math.min(w-6,rect.right+6)-left)+'px';spot.style.height=Math.max(0,Math.min(h-6,rect.bottom+6)-top)+'px';
 card.style.maxHeight=Math.max(180,Math.floor(h*.52))+'px';
 if(rect.top+rect.height/2>h/2)card.style.top='12px';else card.style.bottom='12px';
}
function taskTarget(step){
 var main=document.querySelector('#p'+step.tab+'s .main');if(!main)return null;
 var text=step.copy,quotes=Array.from(text.matchAll(/["“]([^"”]+)["”]/g)).map(function(m){return m[1]});
 var tokens=text.split(/[\s、,;:()।]+/).filter(function(word){return word.length>=4});
 var candidates=Array.from(main.querySelectorAll('.btn,.btn2,.inp,.pill,.card b,.mar,.mut,.h,.kp,.dot'));
 var best=null,bestScore=0;
 candidates.forEach(function(el){
  var label=el.textContent.trim();if(!label||label.length>150)return;
  var score=0;quotes.forEach(function(q){if(label.includes(q)||q.includes(label))score+=12});
  tokens.forEach(function(word){if(label.includes(word))score+=2});
  if(score>bestScore){bestScore=score;best=el}
 });
 return bestScore>=2?best:main;
}
function render(){
 var step=steps[index];showTab(step.tab);
 if(step.screen!==undefined)flows[step.tab].set(step.screen);
 if(step.tab===0){
  var filter=document.getElementById('fsel');filter.value=step.category||'all';filter.onchange();
  if(step.hero!==undefined){heroI=step.hero;hvRender()}
 }
 target=step.task!==undefined?taskTarget(step):(step.selector?document.querySelector(step.selector):null);
 document.getElementById('tour-title').textContent=step.title;document.getElementById('tour-copy').textContent=step.copy;
 document.getElementById('tour-tip').textContent='মেন্টরের পরামর্শ: '+step.tip;
 document.getElementById('tour-count').textContent=(index+1)+' / '+steps.length;
 var progress=document.getElementById('tour-progress');progress.max=steps.length;progress.value=index+1;
 var option=Array.from(jump.options).filter(function(item){return Number(item.value)<=index}).pop();if(option)jump.value=option.value;
 prev.disabled=index===0;next.textContent=index===steps.length-1?'বুঝেছি, শেষ করি ✓':'পরের ধাপ →';
 if(target)target.scrollIntoView({behavior:'instant',block:'center',inline:'center'});
 position();requestAnimationFrame(position);next.focus({preventScroll:true});
}
function open(){
 if(active)return;active=true;oldFocus=document.activeElement;oldTab=window.curTab||0;savedScroll=[window.scrollX,window.scrollY];
 snapshot={filter:document.getElementById('fsel').value,user:flows[2].get(),admin:flows[3].get(),hero:heroI};
 root.hidden=false;document.body.classList.add('tour-open');
 inertStates=Array.from(document.body.children).filter(function(el){return el!==root&&el.tagName!=='SCRIPT'&&el.tagName!=='STYLE'}).map(function(el){var old=el.inert;el.inert=true;return [el,old]});
 scope.value='all';rebuild('all');render();
}
function close(){
 if(!active)return;active=false;root.hidden=true;target=null;document.body.classList.remove('tour-open');
 inertStates.forEach(function(item){item[0].inert=item[1]});
 flows[2].set(snapshot.user);flows[3].set(snapshot.admin);
 document.getElementById('fsel').value=snapshot.filter;document.getElementById('fsel').onchange();
 heroI=snapshot.hero;hvRender();
 showTab(oldTab);window.scrollTo(savedScroll[0],savedScroll[1]);
 try{localStorage.setItem(storageKey,'seen')}catch(e){}
 (oldFocus&&oldFocus.isConnected?oldFocus:help).focus({preventScroll:true});
}
help.addEventListener('click',open);document.getElementById('tour-close').addEventListener('click',close);
scope.addEventListener('change',function(){rebuild(scope.value);render()});jump.addEventListener('change',function(){index=Number(jump.value);render()});
prev.addEventListener('click',function(){if(index>0){index--;render()}});next.addEventListener('click',function(){if(index===steps.length-1)close();else{index++;render()}});
document.addEventListener('keydown',function(e){
 if(!active)return;
 if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();close();return}
 if(e.key==='Tab'){
  var controls=Array.from(card.querySelectorAll('button:not(:disabled),select')),first=controls[0],last=controls[controls.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
 if(e.key==='ArrowRight'||e.key==='ArrowLeft')e.stopImmediatePropagation();
},true);
window.addEventListener('resize',position);window.addEventListener('scroll',position,true);
var seen=false;try{seen=localStorage.getItem(storageKey)==='seen'}catch(e){}if(!seen)setTimeout(open,650);
})();

</script>
